<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: <input type="text" name="nome" id="inome" required maxlength="30" placeholder="nome completo" autocomplete="name"></label>
        </p>
        <p>
            <label for="imedia">Média </label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required value="5">
        </p>
        <p>
            <label for="imes">Ano letivo</label> 
            <input type="month" name="mes" id="imes" value="2025-08">
        </p>
        <p>
            <label for="idata">Dia da prova</label> 
            <input type="date" name="data" id="idata" value="2025-08-19">
        </p>
        <p>
            Hora da prova <input type="time" name="hora" id="ihora">
        </p>
        <p>
            <input type="submit" value="Enviar">
        </p>
        <p>
            <input type="reset" value="Limpar">
        </p>
    </form>

</body>
</html>
