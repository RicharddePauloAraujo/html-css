<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p> <label for="inome">Nome:</label> 
            <input type="text" name="nome" id="inome" required autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média </label>
            <input type="number" name="media" id="imedia" step="0.1" required>
        </p>
        <p>
            <label for="imes">Mes</label>
             <input type="month" name="mes" id="imes" required>
        </p>
        <p>
            <label for="idata">Ano Letivo </label>
            <input type="date" name="data" id="idata"required>
        </p>
        <p>
            <label for="ihora">Horário da prova</label> <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
